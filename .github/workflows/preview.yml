name: Deploy fixed PR9 preview (manual only)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fixed-pr9-preview-pages
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == '0857ken/tw-market-scanner-pr9-preview' && github.event.repository.private == false && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python3 verify_candidate.py
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: site/
          include-hidden-files: true
          retention-days: 1
  deploy:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
        with:
          error_count: 1
